<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 10px 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .preview-header {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .device-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--foreground, #f8fafc);
      letter-spacing: 0.02em;
    }

    /* iPhone 17 Pro Max 擬真旗艦外框 */
    .iphone-wrapper {
      position: relative;
      width: 420px;
      height: 840px;
      background: #020617;
      border: 8px solid #27272a;
      border-radius: 46px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 0 2px #3f3f46,
        inset 0 0 4px rgba(255, 255, 255, 0.15);
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 頂部動態島 (Dynamic Island) */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 28px;
      background: #000000;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-sizing: border-box;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .island-lens {
      width: 11px;
      height: 11px;
      background: #090d16;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .island-sensor {
      width: 9px;
      height: 9px;
      background: #050811;
      border-radius: 50%;
    }

    /* 真正的互動 iframe 視窗 (等比呈現手機網站) */
    .device-screen {
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0f1d;
      border-radius: 38px;
      display: block;
    }

    /* 底部 Home Bar */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>實時互動預覽 (LIVE INTERACTIVE)</span>
    </div>
    <div class="device-title">iPhone 17 Pro Max • 支援點擊滾動</div>
  </div>

  <div class="iphone-wrapper">
    <!-- Dynamic Island -->
    <div class="dynamic-island">
      <div class="island-sensor"></div>
      <div class="island-lens"></div>
    </div>

    <!-- 真正可即時操作的互動式網頁 iframe -->
    <iframe class="device-screen" src="index.html" title="廖倫豪博士作品集實時預覽"></iframe>

    <!-- Home Indicator -->
    <div class="home-bar"></div>
  </div>
</body>
</html>
