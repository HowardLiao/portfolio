<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: flex-start;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .device-mockup {
      width: 380px;
      background: #000;
      border: 10px solid #27272a;
      border-radius: 46px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 2px #52525b;
      overflow: hidden;
      position: relative;
    }
    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      background: #0f172a;
      border-radius: 50%;
      border: 1px solid #1e293b;
    }
    .sensor {
      width: 8px;
      height: 8px;
      background: #090d16;
      border-radius: 50%;
    }
    /* Screen Image */
    .screen-img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="device-mockup">
    <div class="dynamic-island">
      <div class="sensor"></div>
      <div class="camera-lens"></div>
    </div>
    <img class="screen-img" src="iphone_17_pro_max_view.png" alt="iPhone 17 Pro Max 實機畫面">
    <div class="home-indicator"></div>
  </div>
</body>
</html>
